<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="styles-login.css">
</head>

<body>
    <header>
        <h1>Sorting game</h1>
    </header>
    <div class="form">
        <form action="#">
            <!-- action attribute specifies where to send the form data when the form is submitted. In this case, it is set to "#" which means that the form will not be sent anywhere. -->
            <label for="name">Username:</label>
            <input type="text" id="name" name="name" /><br /><br /><br /><br />

            <input type="submit" value="Login" class="submit"/>
        </form>
    </div>
</body>

</html>
